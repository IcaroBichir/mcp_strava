[project]
name = "strava-mcp"
version = "0.1.0"
description = "MCP server for Strava — pull activities and create reports in Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "strava", "claude", "fitness", "running", "cycling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
strava-mcp = "strava_mcp.__main__:cli"

[project.urls]
Homepage = "https://github.com/icarobichir/strava-mcp"
Issues = "https://github.com/icarobichir/strava-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
